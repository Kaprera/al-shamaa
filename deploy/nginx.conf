# Nginx server block. Drop the contents into your existing server {} or include
# this file from it. See deploy/CSP.txt before editing the CSP line.

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;                     # nginx >= 1.25.1; older builds: `listen 443 ssl http2;`
  server_name al-shamaa.com www.al-shamaa.com;

  root /var/www/al-shamaa;
  index index.html;
  charset utf-8;

  # ssl_certificate / ssl_certificate_key go here.

  # --- Security -----------------------------------------------------------
  # `always` matters: without it these are dropped on 404s and other error
  # responses, which is exactly where a scanner will look.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self' 'sha256-qjmDI1eVT6YrJplB8t1HEFGRq4b1q9WQF68a6y5iqec='; connect-src 'self'; manifest-src 'self'; upgrade-insecure-requests" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), xr-spatial-tracking=(), interest-cohort=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header X-Permitted-Cross-Domain-Policies "none" always;
  server_tokens off;

  # --- Compression --------------------------------------------------------
  # woff2 carries its own Brotli stream; compressing it again only burns CPU.
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

  # ngx_brotli, if built in. Static beats dynamic here: the assets never change
  # between deploys, so pre-compress them once (see the note at the bottom).
  # brotli on;
  # brotli_static on;
  # brotli_comp_level 6;
  # brotli_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

  # --- Caching ------------------------------------------------------------
  # Every add_header in a location replaces the inherited set, so the security
  # headers have to be repeated inside each block that adds one of its own.
  location = /index.html {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    include /etc/nginx/snippets/al-shamaa-security.conf;   # the block above, extracted
  }

  location ~* \.(?:css|js|woff2|png|jpe?g|svg|webp|ico)$ {
    # Stable filenames: the ?v= query string in index.html is what busts CSS
    # and JS. Bump it when you edit either file.
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    include /etc/nginx/snippets/al-shamaa-security.conf;
    access_log off;
  }

  # Working originals for the logo marks — kept in the repo, not part of the site.
  location ^~ /assets/img/_source/ { return 404; }
  location ^~ /Ohana/ { return 404; }

  location / { try_files $uri $uri/ =404; }
}

server {
  listen 80;
  listen [::]:80;
  server_name al-shamaa.com www.al-shamaa.com;
  return 301 https://$host$request_uri;
}

# Pre-compressing for brotli_static / gzip_static, from the site root:
#   find . -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.svg' -o -name '*.xml' -o -name '*.txt' \) \
#     -exec brotli -f -q 11 -k {} \; -exec gzip -f -9 -k {} \;
